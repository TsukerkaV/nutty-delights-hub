name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static SPA
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare Pages folder
        id: prep
        run: |
          if [ -d dist/client ]; then
            PUB=dist/client
          elif [ -d dist ]; then
            PUB=dist
          else
            echo "No dist output found" >&2
            ls -la
            exit 1
          fi
          touch "$PUB/.nojekyll"
          if [ -f "$PUB/_shell.html" ]; then
            cp "$PUB/_shell.html" "$PUB/index.html"
            cp "$PUB/_shell.html" "$PUB/404.html"
          elif [ -f "$PUB/index.html" ]; then
            cp "$PUB/index.html" "$PUB/404.html"
          fi
          echo "publish_dir=$PUB" >> "$GITHUB_OUTPUT"
          echo "Publishing from $PUB"
          ls -la "$PUB" | head
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.prep.outputs.publish_dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Build static SPA
        run: npm run build
        env:
          GITHUB_PAGES: "true"
      - name: Prepare Pages folder
        run: |
          if [ -d dist/client ]; then
            PUB=dist/client
          elif [ -d dist ]; then
            PUB=dist
          else
            echo "No dist output found" >&2
            ls -la
            exit 1
          fi
          touch "$PUB/.nojekyll"
          if [ -f "$PUB/_shell.html" ]; then
            cp "$PUB/_shell.html" "$PUB/index.html"
            cp "$PUB/_shell.html" "$PUB/404.html"
          elif [ -f "$PUB/index.html" ]; then
            cp "$PUB/index.html" "$PUB/404.html"
          fi
          echo "PUB=$PUB" >> "$GITHUB_ENV"
          ls -la "$PUB" | head
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ env.PUB }}
          force_orphan: true
